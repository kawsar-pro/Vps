
name: "🖥️ Free GitHub VPS - SSH + Tmate"

on:
  workflow_dispatch:
    inputs:
      session_hours:
        description: "VPS Session Duration"
        required: true
        default: "6"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"

permissions:
  contents: read

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 359

    env:
      VPS_USER: ${{ secrets.VPS_USER || 'kawsar' }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD || 'kawsar' }}
      SESSION_HOURS: ${{ inputs.session_hours }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install and Configure VPS
        run: |
          chmod +x setup.sh verify.sh
          ./setup.sh

      - name: Verify VPS
        run: ./verify.sh

      - name: Start Tmate SSH Tunnel
        shell: bash
        run: |
          mkdir -p "$HOME/.tmate"

          tmate -S "$HOME/.tmate/tmate.sock" new-session -d
          tmate -S "$HOME/.tmate/tmate.sock" wait tmate-ready

          SSH_CONNECTION=$(tmate -S "$HOME/.tmate/tmate.sock" display -p '#{tmate_ssh}')
          WEB_CONNECTION=$(tmate -S "$HOME/.tmate/tmate.sock" display -p '#{tmate_web}')

          if [ -z "$SSH_CONNECTION" ]; then
            echo "::error::Tmate SSH connection was not created."
            exit 1
          fi

          echo "======================================"
          echo "          VPS IS READY"
          echo "======================================"
          echo "SSH CONNECTION:"
          echo "$SSH_CONNECTION"
          echo ""
          echo "WEB CONNECTION:"
          echo "$WEB_CONNECTION"
          echo "======================================"

          {
            echo "## 🟢 VPS IS READY"
            echo ""
            echo "### SSH Connection"
            echo "\`\`\`bash"
            echo "$SSH_CONNECTION"
            echo "\`\`\`"
            echo ""
            echo "### Web Terminal"
            echo "$WEB_CONNECTION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep VPS Alive
        shell: bash
        run: |
          DURATION=$((SESSION_HOURS * 3600))

          echo "VPS session: $SESSION_HOURS hour(s)"

          while [ "$DURATION" -gt 0 ]; do
            sleep 30
            DURATION=$((DURATION - 30))
          done

          echo "VPS session ended."

      - name: Stop Tmate
        if: always()
        run: |
          if [ -S "$HOME/.tmate/tmate.sock" ]; then
            tmate -S "$HOME/.tmate/tmate.sock" kill-session || true
          fi
