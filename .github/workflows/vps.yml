name: 🖥️ Free GitHub VPS - SSH + Tailscale

on:
  workflow_dispatch:
    inputs:
      session_hours:
        description: '⏱️ Session Duration (hours)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 359

    env:
      VPS_USER:          ${{ secrets.VPS_USER      || 'luffy' }}
      VPS_PASSWORD:      ${{ secrets.VPS_PASSWORD  || 'luffy@123' }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      VPS_HOSTNAME:      gh-vps-${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Run setup
        run: |
          chmod +x ./setup.sh ./verify.sh
          ./setup.sh

      - name: Run verify
        run: ./verify.sh

      - name: Display connection information
        run: |
          # Poll up to 20 seconds in case setup.sh exited before IP fully propagated
          TS_IP=""
          for i in $(seq 1 10); do
            TS_IP=$(tailscale ip -4 2>/dev/null | head -n1 || true)
            if [ -n "$TS_IP" ]; then
              break
            fi
            echo "Waiting for Tailscale IP... ($i/10)"
            sleep 2
          done

          if [ -z "$TS_IP" ]; then
            TS_IP="not-connected — check TAILSCALE_AUTHKEY secret"
          fi

          echo ""
          echo "=================================================="
          echo "🟢  VPS IS READY"
          echo "=================================================="
          echo "  Tailscale IP : $TS_IP"
          echo "  Username     : $VPS_USER"
          echo "  Password     : $VPS_PASSWORD"
          echo "  Port         : 22"
          echo ""
          echo "  Connect with :"
          echo "    ssh $VPS_USER@$TS_IP"
          echo "=================================================="
          echo ""

      - name: Keep VPS Alive
        run: |
          echo "VPS is running. Do not cancel this job."
          sleep 21500
